name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and tests
    # The package needs a Swift 6.2 or newer toolchain, which the macOS 26 image ships.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Install audio tools
        run: brew install ffmpeg
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Prepare speaker crop test runtime
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/speaker-crop-venv"
          python3 -m venv "$venv"
          "$venv/bin/python3" -m pip install --disable-pip-version-check \
            torch==2.13.0 pyannote.core==6.0.1 soundfile==0.14.0
          "$venv/bin/python3" -m pip install --disable-pip-version-check --no-deps \
            pyannote.audio==4.0.7
          "$venv/bin/python3" -c "import torch, numpy, soundfile, pyannote.core"
          site_packages="$(
            "$venv/bin/python3" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])'
          )"
          echo "CALL_RECORDER_TEST_DIARIZATION_PYTHON=$venv/bin/python3" >> "$GITHUB_ENV"
          echo "CALL_RECORDER_TEST_DIARIZATION_SITE_PACKAGES=$site_packages" >> "$GITHUB_ENV"
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  mcp:
    name: MCP server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bunx pnpm@10.33.2 install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
